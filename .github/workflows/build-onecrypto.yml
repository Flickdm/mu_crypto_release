name: Build OneCryptoPkg

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate prerelease tag
        env:
          IS_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        shell: bash
        run: |
          if [ "$IS_PRERELEASE" = "true" ] && [[ ! "$RELEASE_TAG" =~ -Beta[0-9]+$ ]]; then
            echo "::error title=Invalid prerelease tag::Prerelease tags must end in -BetaN, where N is a non-negative integer."
            exit 1
          fi

  build:
    needs: validate-release-tag
    strategy:
      matrix:
        variant: [accelerated, non-accelerated]
        include:
          - variant: accelerated
            bld_flags: ''
          - variant: non-accelerated
            bld_flags: BLD_*_NON_ACCEL=TRUE
    uses: ./.github/workflows/onecrypto-build-variant.yml
    with:
      variant: ${{ matrix.variant }}
      bld_flags: ${{ matrix.bld_flags }}
      tool_chain_tag: ${{ vars.TOOL_CHAIN_TAG || 'CLANGPDB' }}

  publish:
    needs: build
    strategy:
      matrix:
        include:
          - variant: accelerated
            publish_name: OneCrypto-Accelerated
          - variant: non-accelerated
            publish_name: OneCrypto-NonAccelerated
    uses: ./.github/workflows/onecrypto-publish-variant.yml
    with:
      variant: ${{ matrix.variant }}
      publish_name: ${{ matrix.publish_name }}
    permissions:
      contents: write
